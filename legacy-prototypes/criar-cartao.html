<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CardVoz</title>
</head>
<body>

  <h1>CardVoz</h1>

  <h2>Adicionar cartao</h2>

  <form action="baralho.html" method="get">
    <p>
      <label for="pergunta">Pergunta</label><br>
      <textarea id="pergunta" name="pergunta"></textarea>
    </p>
    <p>
      <label for="resposta">Resposta</label><br>
      <textarea id="resposta" name="resposta"></textarea>
    </p>
    <p>
      <button type="submit">Salvar cartao</button>
    </p>
  </form>

  <p><a href="baralho.html">Voltar para o baralho</a></p>

</body>
</html>
